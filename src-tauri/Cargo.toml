[package]
name = "wt-media-desktop-shell"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
# Already in the lockfile as a dependency of the tauri crates, so this adds no
# new crate. Default features include `serde` + `parse`.
toml = "0.9"
# `v4` pulls in `getrandom`, which the lockfile already carries for the tauri
# crates, so this adds no new crate either. Only `v4` is enabled: the other
# versions are time-ordered or MAC-based, and neither is wanted for a bearer
# credential.
uuid = { version = "1", features = ["v4"] }
# Emitting. `tracing`/`tracing-core` were already in the lockfile as transitive
# dependencies of h2, hyper-util and softbuffer -- those three are already
# emitting into any subscriber that exists, which is why the target filter has
# to be explicit (see `logging::targets`). Default features are off because
# `attributes` would pull in the `tracing-attributes` proc macro and nothing
# here uses `#[instrument]`; the rest of `default` is the `log` bridge, which
# this crate does not need either.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# The collector. `default-features = false` + `fmt`/`std` only: the defaults
# would also enable `env-filter` (matchers + regex) and `ansi`
# (nu-ansi-term). Measured after the change: 4 crates added in total
# (tracing-subscriber, sharded-slab, thread_local, lazy_static) and
# `nu-ansi-term`/`matchers`/`tracing-log` at zero.
#
# No `tracing-appender`: it has **no rename-on-roll**. `Inner::new` opens the
# dated file directly, so `Rotation::HOURLY` + `prefix("app.log")` yields
# `app.log.2026-09-24-19` while `Rotation::NEVER` yields a stable `app.log` --
# and the two cannot be combined. CHG-C's shape needs both halves at once.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# The rotator (CHG-20260823-058 T-02, the user's ruling D-02). It is the one
# crate that gives all four things this shape needs: a stable live `desktop.log`,
# rename-on-roll to `desktop.log.<YYYY-MM-DD-HH>`, an hourly trigger, and
# **age-based deletion** (`FileLimit::Age`) -- the last is what no other
# off-the-shelf rotator offers, and it is why nothing is left to hand-roll.
# Registered exception: its doc says the base name may not contain `.`, and ours
# does. Measured to work (`scan_suffixes` strips the `{base}.` prefix rather than
# splitting on the dot), but that is an upgrade risk: re-run
# `evidence/task-02-log-rotation.md`'s probe after any version bump.
file-rotate = "0.8"
# `FileLimit::Age` takes chrono's `Duration` and the crate does not re-export it,
# so this is a direct dependency rather than a transitive one. It also supplies
# the local-time stamp for a record (`logging::backend`), which is the same clock
# the archive names are built from.
chrono = "0.4"
# One window, one app (the ruling D-04). Not a nicety: a stable `desktop.log`
# means two instances share one live file, and the crate renames it out from
# under whichever handle is still writing.
tauri-plugin-single-instance = "2"
# Free space (`storage::available_bytes`). Already in the lockfile as a transitive
# dependency of the tauri stack, so this adds no new crate -- it asks for the
# `fs` feature, which is off by default. Chosen over `libc` + a hand-written
# `unsafe` statvfs: this crate has no `unsafe` in it, and rustix's wrapper is the
# same call with the layout differences already handled.
#
# `process` (CHG-059 T-03) adds the two calls the exit protocol is built on:
# `kill_process` for the ask and `test_kill_process` for the liveness reading
# between the ask and the deadline. It is **not** in rustix's default features --
# `default = ["std"]` only -- so it is asked for here, and the `unsafe` argument
# above carries over: `process/kill.rs` is a safe wrapper over `kill(2)`, and
# this crate still contains no `unsafe` of its own.
rustix = { version = "1", features = ["fs", "process"] }
# The support bundle's container (CHG-058 T-07, ruling Q-06: `tar` + `flate2`).
# `flate2` is already in the lockfile as a dependency of `png`; `tar` is new to
# the graph but nothing else is -- see the T-07 evidence for the measured delta.
# A gzipped tar rather than a zip because the bundle is one directory tree and
# nothing here needs zip's per-entry metadata (Q-06).
#
# `default-features = false` drops `xattr`, which tar only reaches for when
# **unpacking** (extended attributes on the way out). This crate only ever
# builds an archive, so the feature would be a crate in the graph for a code path
# that cannot run. `filetime`, tar's other unix dependency, is not optional --
# measured: dropping it is not available.
tar = { version = "0.4", default-features = false }
flate2 = "1"
# The bundle's integrity line, beside it as `<name>.sha256`. Both are already in
# the lockfile as transitive dependencies (`sha2` through `tauri-codegen`, `hex`
# through `serde_with`), so this adds no crate -- it makes them direct, which is
# what `cargo` requires before they can be named in this crate's own code.
sha2 = "0.10"
hex = "0.4"
ring = "0.17"
base64 = "0.22"
# Opening one of this app's own folders in the file manager (CHG-058 T-08, the
# log viewer's 「打开日志文件夹」 and the settings page's way to reach an
# unreadable `settings.toml`). Already in the lockfile as a dependency of
# `tauri-plugin-shell`, so this adds no new crate to the graph -- it makes an
# existing one direct, which is what `cargo` requires before our own code may
# name it. Chosen over a `match` on three platforms' openers: the differences
# (`open`, `explorer`, `xdg-open`, and the quoting each needs) are exactly what a
# wheel is for, and this machine can only ever test one arm of such a `match`.
open = "5"
# The folder picker for the operator's save location (CHG-061 T-04). The plugin
# rather than `rfd` directly, for the reason the plan records: it dispatches
# `NSOpenPanel` to the main thread itself, and it arrives with the capability
# file's permission model, so `dialog:allow-open` is the whole of what the page
# is allowed to reach. `rfd`'s synchronous API on a Tauri command thread is the
# macOS hazard this avoids.
tauri-plugin-dialog = "2"

# macOS only, and for one line: the main window's webview configuration, which is
# where `javaScriptCanOpenWindowsAutomatically` has to be set for a page to raise
# a new window request that does not have a user gesture behind it (see
# `external_links`). `WebviewWindowBuilder::with_webview_configuration` names
# these types in its signature (tauri 2.11.5 `webview/webview_window.rs:1341`), so
# they have to be namable here. Both crates are already in the lockfile as
# tauri's own dependencies -- 0.6.4 and 0.3.2 -- which is what keeps this from
# adding a crate to the graph; the feature list mirrors tauri's own
# (`tauri-2.11.5/Cargo.toml:389`) except for `WKPreferences`, which tauri does
# not need and this shell does.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "WKWebViewConfiguration",
    "WKPreferences",
] }

# The same `tauri` the app already depends on, with one feature turned on, and
# **only in test builds**: `test` is what exposes `tauri::test::mock_app`, whose
# `MockRuntime` runs the real `tauri-plugin-shell` spawn path. That is what lets
# the suite hold a real `CommandChild` in the managed slot — the handle whose
# staleness is the defect T-02 closes, and the one thing a fake cannot stand in
# for. The crate adds no new dependency; `cargo build` (and therefore the
# shipped app) does not see dev-dependencies at all, so this feature is off in
# what we ship.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
