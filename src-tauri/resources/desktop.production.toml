# WT Media Desktop — production configuration.
#
# Ships inside the bundle (`bundle.resources` in tauri.conf.json) and is also
# compiled into the binary via `include_str!`, so a missing or corrupt copy
# degrades to a known-good configuration instead of a window with no CSP.
#
# Nothing secret belongs in this file: it is distributed with the app. The
# per-launch runtime token is generated at startup, and the Cloud node
# credential lives only in native memory.

environment = "production"

[agent]
# The Local Agent sidecar listens on loopback only. `localhost` and `::1` are
# accepted as well; anything else fails validation.
host = "127.0.0.1"
port = 8765
# data_dir = "/path/to/agent-data"
# Unset means "the Agent resolves its own default", which is the normal case.
# Mirroring the Agent's `agent.data_dir`: when set, Desktop passes it through as
# `WT_MEDIA_AGENT_DATA_DIR`; when unset, the variable is not passed at all.

[cloud]
base_url = "http://127.0.0.1:18080"

[browser]
# Injected as `connect-src` when the window is created, so the address lives
# here rather than as a literal in tauri.conf.json.
csp_connect_src = "http://127.0.0.1:18080"

[http]
# Both must be > 0. `reqwest::Client` has no timeout by default, which means a
# hung Agent or Cloud endpoint would otherwise hold a command forever.
request_timeout_seconds = 30
connect_timeout_seconds = 10

[sidecar]
# How long to wait for the freshly spawned sidecar to answer before reporting
# the start as failed.
start_timeout_ms = 15000

[development]
# Release bundles must run only the bundled sidecar; a production config may
# never opt into a system Python.
python_fallback = false
