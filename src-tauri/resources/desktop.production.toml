# WT Media Desktop — production configuration.
#
# Ships inside the bundle (`bundle.resources` in tauri.conf.json) and is also
# compiled into the binary via `include_str!`, so a missing or corrupt copy
# degrades to a known-good configuration instead of a window with no CSP.
#
# Nothing secret belongs in this file: it is distributed with the app. The
# per-launch runtime token is generated at startup, and the Cloud node
# credential lives only in native memory.

environment = "production"

[agent]
# The Local Agent sidecar listens on loopback only. `localhost` and `::1` are
# accepted as well; anything else fails validation.
host = "127.0.0.1"
port = 8765
# data_dir = "/path/to/agent-data"
# Unset means "the Agent resolves its own default", which is the normal case.
# Mirroring the Agent's `agent.data_dir`: when set, Desktop passes it through as
# `WT_MEDIA_AGENT_DATA_DIR`; when unset, the variable is not passed at all.

[cloud]
base_url = "http://127.0.0.1:18080"

[browser]
# Injected as `connect-src` when the window is created, so the addresses live
# here rather than as literals in tauri.conf.json.
#
# `ipc:` covers the Windows/Linux IPC scheme. On macOS Tauri's IPC transport is
# an `http:` fetch to `http://ipc.localhost`, so the scheme-source alone does not
# match it and the explicit host is what clears those refusals; macOS has a
# `postMessage` fallback, which is why a missing entry costs refusals rather than
# a dead window. Measured: adding both dropped `ipc://` refusals from 3 to 0.
csp_connect_src = "ipc: http://ipc.localhost http://127.0.0.1:18080"

[http]
# Both must be > 0. `reqwest::Client` has no timeout by default, which means a
# hung Agent or Cloud endpoint would otherwise hold a command forever.
request_timeout_seconds = 30
connect_timeout_seconds = 10

[sidecar]
# How long to wait for the freshly spawned sidecar to answer before reporting
# the start as failed.
start_timeout_ms = 15000

[logging]
# `auto` follows the environment the app is *running as* in the build sense
# (development DEBUG, production INFO, ruling 四); an explicit level overrides it.
# `off`, `error` and `warn` are legal but leave the launch summary unwritten and
# the log file uncreated -- the file appears at the first record that survives
# the filter. Measured, see T-15's evidence.
level = "auto"
# One file rolls at this size, then the oldest files go: 14 days, and 100 MB for
# the directory in total. These three are the values `rolling::SHIPPED` holds;
# a test asserts the two cannot drift apart. A single over-long record is
# truncated rather than allowed to grow the file past the cap.
max_file_bytes = 20971520
retention_days = 14
total_bytes = 104857600

[development]
# Release bundles must run only the bundled sidecar; a production config may
# never opt into a system Python.
python_fallback = false
