         桌面端 CSP 没有 script-src，回落 default-src 'self' 会把它拦掉，于是每个 <use> 都解析为空、

         这里刻意用普通 <script> 而非 module：它在解析期同步执行，必然早于下方 defer 的 module 入口。
         详见 public/tdesign-icons/README.md。 -->
    <script src="/tdesign-icons/0.4.3/index.js"></script>
