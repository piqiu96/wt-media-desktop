name: M0 Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Bootstrap Desktop
        run: scripts/bootstrap.sh

      - name: Lint Desktop
        run: npm run lint

      - name: Test Desktop
        run: scripts/test.sh

      - name: Build Desktop
        run: scripts/build.sh
