name: M0 Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Not a Node package toolchain -- there is no `package.json` here. The two
      # suites under `tests/` call `node` to read JSON (`node -p` / `node -e`),
      # so the runtime has to be present; nothing is installed from npm, hence
      # no `cache:` and no `cache-dependency-path:` (there is no lockfile).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Desktop
        run: scripts/test.sh
